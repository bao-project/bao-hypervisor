# Bao Hypervisor VM Configuration
# This YAML describes the fields needed to generate a C config file (config.c)

vms:
  - vm1:
    name: "baremetal"
    build_options:
    config:
      image:
        base_addr: 0x32200000
      entry: 0x32200000
      platform:
        cpu_num: 4
        regions:
          - base: 0x32200000
            size: 0x100000
          - base: 0x317C0000
            size: 0x40000
        devs:
          - pa: 0x42980000
            va: 0x42980000
            size: 0x10000
            interrupts:
              - 253
          - interrupts:
              - 27
        arch:
          gic:
            gicc_addr: 0x2C000000
            gicd_addr: 0x47800000
            gicr_addr: 0x47900000
